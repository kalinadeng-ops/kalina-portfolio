  <script id="poster-project-data" type="application/json">{"project":{"title":"茉莉青提气泡茶","category":"海报设计","categoryKey":"posters","next":"poster-red-bean","nextName":"陈皮红豆沙"},"exhibit":{"heading":"茉莉青提气泡茶","kicker":"青隙茶铺 · 茶饮海报","subtitle":"茉莉茶底与青提果肉","number":"07","discipline":"POSTER DESIGN","note":"一起走近这组作品。","noFilm":true,"info":["杯口的白花伸向右上，杯底的青提落在左下，两端拉开一条长对角线。杯子放得很大，杯壁却只用细白线，冰块也用浅色面交叠。这样保住了玻璃的轻盈，左上浓绿的题字仍有足够分量，能和倾斜的杯身取得平衡。","口味和茶饮品类虽然分行，笔形却是连贯的。上行的绿色字直接落在白底上，笔端留有小圆孔。下行把蓝色泡形接成字底，从中反白出「气泡茶」。一次图底转换拉开了两组词的层级，也保全了整个品名的节奏。","左侧价签借用浮泡的圆形，边框只勾一圈蓝线。金额用最大的字，单位和杯量依次缩小，白底将三行信息从繁密的果粒和泡泡中分离出来。右下两行原料说明单独落在留白处，让画面保有轻快感，也让规格和风味各自容易查找。"],"labels":[["斜杯的构图重心","Diagonal Balance"],["题字的图底转换","Reversed Type"],["圆签的信息字级","Badge Hierarchy"]],"coverCaption":"茉莉青提气泡茶 · 品牌海报"},"galleries":[{"id":"poster-original","title":"设计图","english":"Design Gallery","slides":[{"src":"/assets/poster-collection/food-seven-v1/01-jasmine/poster.webp?v=3bafffb211cb","width":1500,"height":2000,"label":"茉莉青提气泡茶","caption":"茉莉青提气泡茶","alt":"青隙茶铺 · 茶饮海报完整设计图","kind":"original","thumb":"/assets/poster-collection/food-seven-v1/01-jasmine/thumb.webp?v=489703ffdf10"}]},{"id":"poster-scene","title":"门店应用效果图","english":"In-Store Application","slides":[{"src":"/assets/poster-collection/food-seven-v1/01-jasmine/scene.webp?v=dc23fa8aecbb","width":1536,"height":1024,"label":"茶饮窗口 · 点单墙海报","caption":"茶饮窗口 · 点单墙海报","alt":"青隙茶铺的茉莉青提气泡茶海报装入细框，悬挂在点单窗口旁的绿色瓷砖墙上。","kind":"scene"}]}]}</script>
