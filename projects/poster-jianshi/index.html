  <script id="poster-project-data" type="application/json">{"project":{"title":"一剪成岁","category":"海报设计","categoryKey":"posters","next":"poster-crunch","nextName":"脆响"},"exhibit":{"heading":"一剪成岁","kicker":"折红纸艺社 · 节气展览海报","subtitle":"二十四节气套色剪纸展","number":"02","discipline":"POSTER DESIGN","note":"一起走近这组作品。","noFilm":true,"info":["为折红纸艺社构想的《一剪成岁》展览，把二十四个节气变成二十四张套色剪纸。给初次看剪纸的观众留两种看法，远处认出燕翼、伞面与麦穗，走近还能在剪去的空处辨认第二个形象。","题字沿用套色剪纸的造型。横画有纸片的薄，转折留着剪刀收尾的尖角，笔画内部的细孔透出底色。《惊蛰》的两字分落在跳蛙两端，《立夏》在扇缘上方并排落字。《芒种》和《处暑》则在画幅右侧竖题。《立春》的“春”字向右下斜落，用一色墨跨过燕背的弧线。《雨水》以修长的“水”字收住竖题。字随剪影转折，在套色交界处仍能读清笔路。","折红纸艺社的展陈提案是一条剪纸光廊。墨蓝灰展墙衬出套色剪纸，朱砂色折墙收住长廊的视线。观众在悬挂的镂空纸幕间穿行，沿一侧看春夏，再转向秋冬。远处看图形与投影在空间里重叠，走近《惊蛰》，可以分辨题字与跳蛙剪影的呼应，以及纸面与画框之间的层次。"],"labels":[["项目介绍","PROJECT INTRODUCTION"],["设计理念","DESIGN CONCEPT"],["展览呈现","EXHIBITION DESIGN"]]},"galleries":[{"id":"poster-original","title":"设计图","english":"Design Gallery","slides":[{"src":"/assets/poster-collection/posters/C01-1.webp?v=3e0b95de4e19","width":1500,"height":2000,"label":"立春","caption":"立春","alt":"一剪成岁 · 立春","kind":"original","thumb":"/assets/poster-collection/thumbs/C01-1.webp?v=5acbb96449ec"},{"src":"/assets/poster-collection/posters/C02-1.webp?v=e52d2fa11d28","width":1500,"height":2000,"label":"雨水","caption":"雨水","alt":"一剪成岁 · 雨水","kind":"original","thumb":"/assets/poster-collection/thumbs/C02-1.webp?v=580057b0cc84"},{"src":"/assets/poster-collection/posters/C03-1.webp?v=d7dfbdcb79b4","width":1500,"height":2000,"label":"惊蛰","caption":"惊蛰","alt":"一剪成岁 · 惊蛰","kind":"original","thumb":"/assets/poster-collection/thumbs/C03-1.webp?v=a6ddf0bd5306"},{"src":"/assets/poster-collection/posters/C04-1.webp?v=5ba7739b081e","width":1500,"height":2000,"label":"春分","caption":"春分","alt":"一剪成岁 · 春分","kind":"original","thumb":"/assets/poster-collection/thumbs/C04-1.webp?v=dfdf5f6109ca"},{"src":"/assets/poster-collection/posters/C05-1.webp?v=c386cc877304","width":1500,"height":2000,"label":"清明","caption":"清明","alt":"一剪成岁 · 清明","kind":"original","thumb":"/assets/poster-collection/t
