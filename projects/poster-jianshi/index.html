  <script id="poster-project-data" type="application/json">{"project":{"title":"一剪成岁","category":"海报设计","categoryKey":"posters","next":"poster-crunch","nextName":"脆响"},"exhibit":{"heading":"一剪成岁","kicker":"折红纸艺社 · 节气展览海报","subtitle":"二十四节气套色剪纸展","number":"02","discipline":"POSTER DESIGN","note":"一起走近这组作品。","noFilm":true,"info":["《立春》的刀口开在粗笔画内部。浅薄荷色透进深绿字面，形成一端收尖的楔形负形，尖角呼应附近的燕翼。刀口两侧仍留有足够的笔画宽度，横竖的走向也能接续。放大能读出切口的形状，缩回整张仍能辨清「立春」二字。","《惊蛰》的蛙从左下跃向右上，「惊」与「蛰」沿反向对角线分置，两股动势在画心交叉。到了《立夏》，占据大半幅的扇骨已从左下向外辐射，标题便收在右上、两字高低错落。前者用分置的字平衡蛙身，后者让紧凑的字组抵住展开的扇面。","《处暑》收起《惊蛰》里闪电般的尖角，改以曲线衔接几层套色。朱红鹭颈折回，淡紫水道也拐了一个弯，两段弧线隔着深色底彼此呼应。右侧竖排的浅色题字稳住这组曲线，鹭颈与水岸的轮廓都能一笔跟到尽头。"],"labels":[["刀口与字形骨架","Cutout Type"],["剪影动势的平衡","Visual Balance"],["套色轮廓的呼应","Color Contours"]]},"galleries":[{"id":"poster-original","title":"设计图","english":"Design Gallery","slides":[{"src":"/assets/poster-collection/posters/C01-1.webp?v=3e0b95de4e19","width":1500,"height":2000,"label":"立春","caption":"立春","alt":"一剪成岁 · 立春","kind":"original","thumb":"/assets/poster-collection/thumbs/C01-1.webp?v=5acbb96449ec"},{"src":"/assets/poster-collection/posters/C02-1.webp?v=e52d2fa11d28","width":1500,"height":2000,"label":"雨水","caption":"雨水","alt":"一剪成岁 · 雨水","kind":"original","thumb":"/assets/poster-collection/thumbs/C02-1.webp?v=580057b0cc84"},{"src":"/assets/poster-collection/posters/C03-1.webp?v=d7dfbdcb79b4","width":1500,"height":2000,"label":"惊蛰","caption":"惊蛰","alt":"一剪成岁 · 惊蛰","kind":"original","thumb":"/assets/poster-collection/thumbs/C03-1.webp?v=a6ddf0bd5306"},{"src":"/assets/poster-collection/posters/C04-1.webp?v=5ba7739b081e","width":1500,"height":2000,"label":"春分","caption":"春分","alt":"一剪成岁 · 春分","kind":"original","thumb":"/assets/poster-collection/thumbs/C04-1.webp?v=dfdf5f6109ca"},{"src":"/assets/poster-collection/posters/C05-1.webp?v=c386cc877304","width":1500,"height":2000,"label":"清明","caption":"清明","alt":"一剪成岁 · 清明","kind":"original","thumb":"/assets/poster-collection/thumbs/C05-1.webp?v=738b43081811"},{"src":"/assets/poster-col
