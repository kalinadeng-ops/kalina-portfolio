  <script id="project-copy-data" type="application/json">{"slug":"bike8-asian-championship","exhibit":{"labels":[["用透视线造势","Racing Lines"],["横竖幅的重心","Format Balance"],["赛讯如何分层","Race Details"]],"info":["赛道色带在城市剪影前收束成一个亮点，前轮与骑手却斜着切入这组放射线。放射线将视线引向骑手，身体的倾角又把视线带向另一侧，一个定格动作就有了转弯的方向。远处的楼群压成一排浅色剪影，仍看得出城市轮廓，细节集中在头盔、车身和车轮上。","横幅有足够的距离把字标放在左上、骑手放在右下，两者之间露出的橙色给赛道留出纵深。竖幅收窄，两者改作上下呼应，标题外再加一圈深蓝轮廓。白色笔画即使贴近粉白色带，也能从背景中完整地显出来。","竖版上半幅用大字给出赛事名称，日期贴近标题，地点缩成一行。到下半幅，赛道标识和二维码分置车轮两侧，底部的机构署名另落在白色横条上。小字、标识和码各有一块安静的底色，能容下完整赛讯，也保住了主画面的速度感。"]}}</script>
