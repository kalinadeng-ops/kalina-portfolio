  <script id="project-copy-data" type="application/json">{"slug":"youth-graduation-season","exhibit":{"labels":[["物件嵌入笔画","Pictorial Type"],["抛帽剪影的重复","Visual Rhythm"]],"info":["五个字沿用方正、粗重的字身，只在能容纳图形的部位改变笔画。「青」的内白放进沙漏，学士帽压在「青」「春」上缘，「毕」中两圈眼镜与领带接续原有结构。深蓝轮廓保持连续，读者在正常阅读距离看到题名，靠近才看清字里的毕业物件。","纪年、标题和祝词共用一条中心轴，规整的文字在上半幅稳住画面。到了底边，人群连成剪影，帽子离手后分散成大小与倾角不同的色块。相同的帽形在标题上是静止的，到人群上方却有了抛掷的方向，同一幅画因此容下动作前后的两个瞬间。"]}}</script>
