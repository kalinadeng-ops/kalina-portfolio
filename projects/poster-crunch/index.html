  <script id="poster-project-data" type="application/json">{"project":{"title":"脆响","category":"海报设计","categoryKey":"posters","next":"poster-mist-index","nextName":"雾书"},"exhibit":{"heading":"脆响","kicker":"谷咔 GUKA · 海苔米脆宣传海报","subtitle":"谷咔海苔米脆货架海报","number":"03","discipline":"POSTER DESIGN","note":"一起走近这组作品。","noFilm":true,"info":["两个黑字几乎挨在一起，外轮廓留有咬去一角般的小缺口。厚重的字面给「脆响」一个响亮的起音，红色折线接着把视线弹向四周的小碎屑。字和图利用同一种硬折角衔接，读到这个词时，也能看见一片米饼迸开时的节奏。","左侧米饼放大至越出画幅，截面仍能分辨米粒、海苔与焦黄凸起。向画心移动，碎块逐次变小，零星网点穿插其间。大断面呈现颗粒与焦边，小碎块延续崩裂的方向，两种尺度一起交代了酥脆的质地。","画面上半部的黑色大字向两边撑开，右下方则用完整金袋收住散落的碎屑。袋面把最大字级留给「海苔米脆」，品牌小签退到袋封附近。上方的大字传达声音，袋上的大字指明食物，两个阅读落点有意错开，避免标题和品名争夺同一处注意力。"],"labels":[["拟声字的缺口","Sound Type"],["断面特写的尺度","Texture Scale"],["袋面信息层级","Pack Hierarchy"]]},"galleries":[{"id":"poster-original","title":"设计图","english":"Design Gallery","slides":[{"src":"/assets/poster-collection/posters/D01-2.webp?v=395c076df2b1","width":1500,"height":2000,"label":"脆响","caption":"脆响","alt":"谷咔 GUKA《脆响》海苔米脆海报，黑色咬口大字、红闪电与金色包装袋。","kind":"original","thumb":"/assets/poster-collection/thumbs/D01-2.webp?v=1a73c943cc5d"}]},{"id":"poster-scene","title":"陈列效果图","english":"Retail Display","slides":[{"src":"/assets/poster-collection/scenes/crunch.webp?v=e3404af64eb5","width":1440,"height":960,"label":"应用场景效果图","caption":"应用场景效果图","alt":"谷咔 GUKA《脆响》海报装入零食陈列端架上方的银色画框。","kind":"scene"}]}]}</script>
