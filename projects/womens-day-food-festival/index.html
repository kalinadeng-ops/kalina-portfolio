  <script id="project-copy-data" type="application/json">{"slug":"womens-day-food-festival","exhibit":{"labels":[["给圆体字做高光","Letter Finish"],["边饰的疏密节奏","Border Rhythm"]],"info":["五个标题字收笔圆钝，转角宽厚，给白色小高光留出了位置。高光只点在少数笔端，实心粉字便有了糖衣的光泽。标题字略有高低，下面的时间和地点则缩小字号，对齐成两行。字形的活泼留给活动名，通知最需要查找的两项信息各自站稳。","上边框用糖果、礼盒与纸杯蛋糕组成一串挂饰，细线长短的变化打破等距重复。下方是面积更大的两团水彩甜点，晕开的边线与标题光洁的轮廓形成质感反差。把装饰密度放到四周，中部只留浅纹与零星小星形，小字周围就有完整的阅读空间。"]}}</script>
