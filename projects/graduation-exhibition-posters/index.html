  <script id="project-copy-data" type="application/json">{"slug":"graduation-exhibition-posters","exhibit":{"labels":[["借龙舟铺开长卷","Scroll Motif"],["八字展题重排","Title Reflow"],["展讯的字级层次","Event Hierarchy"]],"info":["画面下沿的龙舟有明确的行进方向。船身顺着横向水面展开，船头的龙首抬向右侧塔楼，细长的塔身把视线重新带回上半幅。红色船身、蓝衣划手与浅色浪纹叠出前后关系，龙舟也有了沿着版面向前划行的空间。","八个书法字保留各自的方寸，幅面的变化交给换行来解决。窄幅分作两列，常规横幅拆成上下两行，校道长幅才连成一行。塔楼始终靠右，船身始终贴住下沿，展题可以重组，观众仍可从同一处认出船头和塔楼。","书法负责展题，日期、地点和专业名称则落在清晰的小字区。竖版把专业名称放在两列题字右侧，数字日期排在下方。横版的展讯随着题组移动，数字之间仍保持规整的间隔。两种文字在字级和行距上拉开距离，细读展讯时，观众不必在龙舟和浪纹之间找字。"]}}</script>
