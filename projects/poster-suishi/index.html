  <script id="poster-project-data" type="application/json">{"project":{"title":"风物手记","category":"海报设计","categoryKey":"posters","next":"poster-jianshi","nextName":"一剪成岁"},"exhibit":{"heading":"风物手记","kicker":"枝间自然书房 · 节气展览海报","subtitle":"二十四节气物候版画展","number":"01","discipline":"POSTER DESIGN","note":"一起走近这组作品。","noFilm":true,"info":["《风物手记》是为枝间自然书房构想的自然观察展。二十四幅海报对应二十四个节气，每幅取一种容易被忽略的变化。读者可以从一片梧桐叶、一根荷梗或一只归燕，认出日历上的时节。","每幅版画先留出一处可题字的空隙。《立春》的燕翼舒展在上方，两个墨字便落到下方的水面。《处暑》的谷穗垂到纸边，题名写在麻雀头顶的空处。两行物候短句以小字落在题名另一侧。隔着展厅先能认出节气，走近再读短句、看叶脉和刻线。","展陈提案以一间物候观察室展开。高侧窗把天光引到展墙，中央的木桌陈列压叶标本与观察册。观众沿西墙从春走到夏，再循东墙看秋冬。入口远景交代这条路线，转到《霜降》近处，画框的边沿和版画上的细线才进入视野。"],"labels":[["项目介绍","PROJECT INTRODUCTION"],["设计理念","DESIGN CONCEPT"],["展览呈现","EXHIBITION DESIGN"]]},"galleries":[{"id":"poster-original","title":"设计图","english":"Design Gallery","slides":[{"src":"/assets/poster-collection/posters/A01-2.webp?v=9b155379a0dd","width":1500,"height":2000,"label":"立春","caption":"立春","alt":"风物手记 · 立春","kind":"original","thumb":"/assets/poster-collection/thumbs/A01-2.webp?v=e92e331b8a3b"},{"src":"/assets/poster-collection/posters/A02-2.webp?v=c2cefbbcaa1a","width":1500,"height":2000,"label":"雨水","caption":"雨水","alt":"风物手记 · 雨水","kind":"original","thumb":"/assets/poster-collection/thumbs/A02-2.webp?v=55c43b5c268e"},{"src":"/assets/poster-collection/posters/A03-2.webp?v=e1ff62bc7df2","width":1500,"height":2000,"label":"惊蛰","caption":"惊蛰","alt":"风物手记 · 惊蛰","kind":"original","thumb":"/assets/poster-collection/thumbs/A03-2.webp?v=70eaaf9ec520"},{"src":"/assets/poster-collection/posters/A04-2.webp?v=72df04785075","width":1500,"height":2000,"label":"春分","caption":"春分","alt":"风物手记 · 春分","kind":"original","thumb":"/assets/poster-collection/thumbs/A04-2.webp?v=6c26eb39bdff"},{"src":"/assets/poster-collection/posters/A05-2.webp?v=83e828caf05b","width":1500,"height":2000,"label":"清明","caption":"清明","alt":"风物手记 · 清明","kind":"original","thumb":"/assets/poster-collection/thumbs/A05-2.webp?v=807173558295"},{"src":"/assets/poster-collect
