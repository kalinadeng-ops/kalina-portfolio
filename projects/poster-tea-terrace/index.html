  <script id="poster-project-data" type="application/json">{"project":{"title":"青岚 · 一山一泡","category":"海报设计","categoryKey":"posters","next":"poster-folded-blocks","nextName":"折叠街区"},"exhibit":{"heading":"青岚 · 一山一泡","kicker":"青岚 QINGLAN · 一山一泡冷泡茶","subtitle":"一山入水","number":"05","discipline":"POSTER DESIGN","note":"一起走近这组作品。","noFilm":true,"info":["宽盒靠左，小袋压在盒前，两者重叠的一角把相近的山纹连在一起。右边杯身与袋子错开，留出一条通透的竖向轮廓。前两件静物用不透明的纸面承接山形，到了玻璃杯便能望见水中的三角茶包。目光从左移到右，「一山入水」就有了可见的过程。","宽盒面容得下数道深浅相叠的山脊，小袋面积缩小，先靠清楚的山脊外缘与盒面相认。再缩到方印大小，只取山峰间一道溪流般的负形。三个尺度各保留最容易辨认的一层，尤其是小印里的留白，让山峰在窄小的签位上仍能分开。","左边的盒靠面积取得视觉重量，右边的杯子则借高度、杯缘高光和杯底的一小片浅金与它平衡。后墙上的斜向窗影划出明暗交界，四个深色标题字落在亮面上。同一束侧光向下照透茶汤、向上衬出字形，静物和标题因此共享一套明暗秩序。"],"labels":[["静物的递进编排","Visual Sequence"],["山形图案的提炼","Mark Reduction"],["侧光与明度平衡","Tonal Balance"]]},"galleries":[{"id":"poster-original","title":"设计图","english":"Design Gallery","slides":[{"src":"/assets/poster-collection/posters/D04-C.webp?v=c9cfa9dce1ed","width":1086,"height":1448,"label":"青岚 · 一山一泡","caption":"青岚 · 一山一泡","alt":"青岚 QINGLAN「一山一泡」冷泡茶包海报，靛蓝盒、独立茶袋与茶汤并列。","kind":"original","thumb":"/assets/poster-collection/thumbs/D04-C.webp?v=b794d839fc6d"}]},{"id":"poster-scene","title":"陈列效果图","english":"Retail Display","slides":[{"src":"/assets/poster-collection/scenes/tea-terrace.webp?v=f329b19d4495","width":1440,"height":960,"label":"青岚茶店 · 橱窗陈列","caption":"青岚茶店 · 橱窗陈列","alt":"青岚茶店的木框橱窗内展示「一山一泡」冷泡茶包海报，木质台面上摆有茶杯和玻璃茶壶。","kind":"scene"}]}]}</script>
