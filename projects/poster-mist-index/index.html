  <script id="poster-project-data" type="application/json">{"project":{"title":"闻序 · 雾书","category":"海报设计","categoryKey":"posters","next":"poster-tea-terrace","nextName":"青岚 · 一山一泡"},"exhibit":{"heading":"闻序 · 雾书","kicker":"闻序 WENXU · 白茶鸢尾淡香水","subtitle":"把白茶穿在身上","number":"04","discipline":"POSTER DESIGN","note":"一起走近这组作品。","noFilm":true,"info":["白色试香纸是最明确的一条指向线。手由右侧伸入，纸尖往瓶盖收，两者之间留一小段空气，刚好容得下试香将要发生的瞬间。左缘花瓣失焦，瓶口和纸尖清晰，景深把这个细小动作从体量大得多的花瓣和石台中挑了出来。","花瓣、纸盒和石台的色相彼此接近，材质的分别便落在反光上。盒面花纹只在边缘显出浅影，玻璃竖纹反射成窄亮线，石面的明暗则断续粗粝。控制这三种边缘的清晰度，透明的瓶身仍然醒目，整幅也能保有柔和的调性。","左上两字收成紧凑的篇名，右上的中英文署名也自成一组，中央一句「把白茶穿在身上」却拉开字距。两端小字聚拢，中间一句舒展开，版面由此有了停顿。文字都落在上方相对平静的区域，下方试香纸尖与瓶盖之间的留白得以完整保留。"],"labels":[["试香纸的指向","Visual Focus"],["同色调材质分离","Tonal Texture"],["文字组的疏密","Type Spacing"]]},"galleries":[{"id":"poster-original","title":"设计图","english":"Design Gallery","slides":[{"src":"/assets/poster-collection/posters/D02-C.webp?v=d91e0b7d845f","width":1086,"height":1448,"label":"闻序 · 雾书","caption":"闻序 · 雾书","alt":"闻序 WENXU「雾书」白茶鸢尾淡香水海报，画面包含试香纸、玻璃瓶和纸盒。","kind":"original","thumb":"/assets/poster-collection/thumbs/D02-C.webp?v=943702839d1e"}]},{"id":"poster-scene","title":"陈列效果图","english":"Retail Display","slides":[{"src":"/assets/poster-collection/scenes/mist-index.webp?v=a6218d3e3898","width":1440,"height":960,"label":"闻序试香区 · 墙面陈列","caption":"闻序试香区 · 墙面陈列","alt":"灰紫墙面上的画框展示闻序「雾书」海报，下方石质台面陈列试香用品。","kind":"scene"}]}]}</script>
